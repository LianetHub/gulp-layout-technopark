<li class="testing-lab-card swiper-slide" data-animate="bottom" itemscope itemtype="http://schema.org/ImageObject">
    <div class="testing-lab-card__image">
        <img src="@@image" class="cover-image" alt="@@alt" itemprop="contentUrl">
    </div>
    <div class="testing-lab-card__content">
        <h3 class="testing-lab-card__title" itemprop="name">@@title</h3>
        <p class="testing-lab-card__desc" itemprop="description">@@desc</p>
    </div>
</li>
