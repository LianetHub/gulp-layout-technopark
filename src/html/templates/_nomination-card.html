<li class="nominations__card" data-animate="bottom">
    <div class="nominations__card-header">
        <div class="nominations__card-icon">
            <img src="@@iconUrl" alt="Иконка" width="46" height="46">
        </div>
        <h3 class="nominations__card-title">@@title</h3>
    </div>
    <div class="nominations__card-text">@@text</div>
    <a href="@@fileUrl" class="nominations__card-btn btn btn-white icon-download" download>
        Скачать форму заявки
    </a>
</li>
