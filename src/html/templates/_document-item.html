<li class="documents__item">
    <div class="document-row">
        <div class="document-row__info">
            <div class="document-row__icon">
                <img src="@img/icons/pdf.svg" alt="PDF">
            </div>
            <span class="document-row__name">@@name</span>
        </div>
        <a href="@@url" class="document-row__btn" download>
            <i class="icon-download"></i>
            <span>Скачать</span>
        </a>
    </div>
</li>
