<a href="@@url" class="apply-card" target="_blank">
    <div class="apply-card__icon-wrapper">
        <div class="apply-card__main-icon">
            <img src="@@iconUrl" alt="@@title">
        </div>
    </div>
    <h3 class="apply-card__title">@@title</h3>
    <div class="apply-card__external-icon icon-share"></div>
</a>
