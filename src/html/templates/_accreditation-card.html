<article class="accreditation-card">
    <div class="accreditation-card__icon">
        <img src="@@iconUrl" alt="@@title">
    </div>
    <div class="accreditation-card__info">
        <h3 class="accreditation-card__title">@@title</h3>
        <p class="accreditation-card__number">@@numberText: <span>@@number</span></p>
        <a href="@@link" class="accreditation-card__link icon-next">
            Проверить документ
        </a>
    </div>
</article>
